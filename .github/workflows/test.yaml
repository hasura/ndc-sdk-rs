name: test

on:
  push:

jobs:
  cargo-test:
    name: run cargo test
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: "-D warnings" # fail on warnings
    steps:
      - uses: actions/checkout@v6

      - name: install tools
        run: |
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build" # share the cache across jobs
          save-if: false

      - name: run tests
        run: cargo test --release --all-targets --all-features

      - name: check openssl is not a dependency of ndc-sdk-core
        # Search the forward dependency tree: `cargo tree -i openssl` exits with
        # an error when openssl is not in the dependency graph at all.
        run: |
          output=$(cargo tree -p ndc-sdk-core --no-default-features -e no-dev --prefix none)
          if echo "$output" | grep -E '^openssl(-sys)? '; then
            echo "openssl was found as a dependency of ndc-sdk-core"
            echo "This should be fixed. openssl dependencies make it hard to make binaries with minimal dynamically linked dependencies such as connector CLI plugins"
            exit 1
          else
            echo "openssl does not appear to be a dependency of ndc-sdk-core 🎉"
            exit 0
          fi
